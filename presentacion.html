<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./presentacion.css">
    <title>Presentación - Los Vigilantes</title>
</head>

<body>
    <div class="presentation">
        <div class="slides" id="slides">
            <section class="slide bg-dark text-white d-flex flex-column justify-content-center align-items-center">
                <h1 class="display-3">Bienvenidos a Los Vigilantes</h1>
                <p class="lead text-center">Prevención, información y comunidad</p>
            </section>

            <section class="slide bg-primary text-white d-flex flex-column justify-content-center align-items-center">
                <h2>¿Quiénes somos?</h2>
                <p class="fs-5 text-center">Un grupo comprometido con educar y proteger a jóvenes y familias.</p>
            </section>

            <section class="slide bg-success text-white d-flex flex-column justify-content-center align-items-center">
                <h2>Nuestra misión</h2>
                <p class="fs-5 text-center">Brindar recursos claros y accesibles para prevenir el consumo de drogas.</p>
            </section>
        </div>

        <div class="controls">
            <button id="prev" class="btn btn-outline-light me-2">Anterior</button>
            <button id="next" class="btn btn-light">Siguiente</button>
        </div>
    </div>

    <script>
        const slides = document.getElementById('slides')
        const total = slides.children.length
        let index = 0

        function show() {
            slides.style.transform = `translateX(-${index * 100}vw)`
        }

        document.getElementById('next').addEventListener('click', () => {
            index = (index + 1) % total
            show()
        })

        document.getElementById('prev').addEventListener('click', () => {
            index = (index - 1 + total) % total
            show()
        })

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') document.getElementById('next').click()
            if (e.key === 'ArrowLeft') document.getElementById('prev').click()
        })

        // Ajuste inicial
        show()
    </script>
</body>

</html>
